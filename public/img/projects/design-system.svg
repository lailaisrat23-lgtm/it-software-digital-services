<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img">
  <title>Multi-product design system with tokens and components</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
