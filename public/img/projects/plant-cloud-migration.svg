<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img">
  <title>Factory telemetry migration from servers to containers</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/><stop offset="1" stop-color="#0f2b46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="600" cy="380" r="300" fill="#1f7ae0" opacity=".1"/>

  <text x="60" y="88" font-family="Inter, Segoe UI, sans-serif" font-size="13" letter-spacing="2" fill="#7e8cb0">BEFORE</text>
  <text x="1060" y="88" font-family="Inter, Segoe UI, sans-serif" font-size="13" letter-spacing="2" fill="#7e8cb0" text-anchor="end">AFTER</text>

  <g>
    <rect x="60" y="110" width="330" height="300" rx="18" fill="#0e1a30" stroke="#26314f"/>
    <rect x="96" y="150" width="258" height="46" rx="8" fill="#1b2743"/>
    <circle cx="118" cy="173" r="6" fill="#f87171"/>
    <rect x="140" y="168" width="120" height="8" rx="4" fill="#33405f"/>
    <rect x="96" y="208" width="258" height="46" rx="8" fill="#1b2743"/>
    <circle cx="118" cy="231" r="6" fill="#fbbf24"/>
    <rect x="140" y="226" width="90" height="8" rx="4" fill="#33405f"/>
    <rect x="96" y="266" width="258" height="46" rx="8" fill="#1b2743"/>
    <circle cx="118" cy="289" r="6" fill="#f87171"/>
    <rect x="140" y="284" width="140" height="8" rx="4" fill="#33405f"/>
    <text x="96" y="356" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7e8cb0">3 servers · 1 maintainer</text>
    <text x="96" y="380" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7e8cb0">deploy window: 6 hours</text>
  </g>

  <path d="M410 300h300" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M690 288l20 12-20 12" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="452" y="326" width="220" height="34" rx="17" fill="#123c35"/>
  <text x="562" y="349" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#2dd4bf" text-anchor="middle">rehearsed · reversible</text>

  <g>
    <rect x="730" y="110" width="410" height="300" rx="18" fill="#0e1a30" stroke="#26314f"/>
    <path d="M905 170a26 26 0 0 1 4 51h-52a20 20 0 0 1 2-40 30 30 0 0 1 46-11z" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <rect x="770" y="250" width="86" height="60" rx="10" fill="#16213c" stroke="#33405f"/>
    <rect x="866" y="250" width="86" height="60" rx="10" fill="#16213c" stroke="#33405f"/>
    <rect x="962" y="250" width="86" height="60" rx="10" fill="#16213c" stroke="#33405f"/>
    <rect x="1058" y="250" width="52" height="60" rx="10" fill="#16213c" stroke="#33405f"/>
    <path d="M800 322v20h250v-20" fill="none" stroke="#33405f" stroke-width="2"/>
    <text x="770" y="380" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7e8cb0">containerised · 1 pipeline</text>
  </g>

  <g>
    <rect x="60" y="450" width="336" height="118" rx="16" fill="#ffffff" opacity=".06"/>
    <text x="86" y="486" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#a8b4d3">UPTIME SINCE MIGRATION</text>
    <text x="86" y="530" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#ffffff">99.97%</text>
  </g>
  <g>
    <rect x="416" y="450" width="336" height="118" rx="16" fill="#ffffff" opacity=".06"/>
    <text x="442" y="486" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#a8b4d3">PRODUCTION DOWNTIME</text>
    <text x="442" y="530" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#ffffff">0 minutes</text>
  </g>
  <g>
    <rect x="772" y="450" width="336" height="118" rx="16" fill="#ffffff" opacity=".06"/>
    <text x="798" y="486" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#a8b4d3">DEPLOY WINDOW</text>
    <text x="798" y="530" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#ffffff">6h → 9 min</text>
  </g>

  <rect x="60" y="600" width="1048" height="70" rx="16" fill="#0e1a30" stroke="#26314f"/>
  <circle cx="94" cy="635" r="6" fill="#2dd4bf"/>
  <text x="112" y="640" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#c9d2ea">Rollback path tested before cutover · dual-write period · zero-downtime switch</text>
</svg>
