  <rect x="786" y="332" width="160" height="10" rx="5" fill="#e5e9f4"/>
  <rect x="786" y="356" width="190" height="10" rx="5" fill="#e5e9f4"/>
  <line x1="786" y1="392" x2="1074" y2="392" stroke="#dfe6f6"/>
  <text x="786" y="424" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#586281">Subtotal</text>
  <text x="1074" y="424" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#0c1424" text-anchor="end">£136.00</text>
  <text x="786" y="452" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#586281">Delivery</text>
  <text x="1074" y="452" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#0c1424" text-anchor="end">£12.00</text>
  <line x1="786" y1="472" x2="1074" y2="472" stroke="#dfe6f6"/>
  <text x="786" y="504" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0c1424">Total</text>
  <text x="1074" y="504" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0c1424" text-anchor="end">£148.00</text>

  <rect x="786" y="536" width="288" height="94" rx="14" fill="#e7f8f1"/>
  <text x="806" y="566" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0a7c56">+21% completion</text>
  <text x="806" y="590" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#3f6b5e">measured over the first</text>
  <text x="806" y="608" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#3f6b5e">peak season after launch</text>
