  <text x="248" y="474" font-family="Inter, Segoe UI, sans-serif" font-size="11" letter-spacing="1" fill="#586281">CVC</text>
  <rect x="248" y="486" width="60" height="12" rx="6" fill="#e5e9f4"/>

