    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00897a"/><stop offset="1" stop-color="#35cf8f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="1010" cy="120" r="180" fill="#35cf8f" opacity=".16"/>
  <circle cx="160" cy="660" r="200" fill="#1f7ae0" opacity=".18"/>

  <rect x="60" y="70" width="1080" height="620" rx="22" fill="#ffffff" stroke="#dfe6f6"/>
  <path d="M60 92a22 22 0 0 1 22-22h1036a22 22 0 0 1 22 22v38H60z" fill="#f2f5fb"/>
  <circle cx="96" cy="110" r="6" fill="#cfd7ea"/>
